# Static client for the compose stack. Vercel serves frontend/ with `cleanUrls`;
# the app's links already carry `.html`, and `try_files` keeps extensionless
# paths working too, so both spellings resolve here.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Cheap liveness probe for the container healthcheck.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
