<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CSEHub — Profile Settings</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Theme bootstrap: runs before first paint so the initial render already
         carries the right palette (no flash of the wrong theme). js/theme.js
         takes over from here. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('csehub-theme');
          var dark = stored ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/profile.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>
    <header class="site-header"></header>

    <main id="app">
      <div class="profile-wrapper container" id="profile-container">
        <div class="loading">
          <span class="loading-spinner"></span>Loading profile…
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <span>CSEHub · Computer science, made clearer.</span>
        <a href="articles.html">Browse the library</a>
      </div>
    </footer>

    <!-- Supabase Client Library CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
    
    <!-- Load page controllers -->
    <script type="module" src="js/profile.js"></script>
  </body>
</html>
