<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CSEHub — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <header class="site-header"></header>

    <main id="app">
      <div class="auth-wrapper">
        <div class="auth-header">
          <h1 id="auth-title">Welcome Back</h1>
          <p id="auth-subtitle">Sign in to your CSEHub account</p>
        </div>

        <div id="alert-box"></div>

        <form id="auth-form">
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input class="form-control" type="email" id="email" required autocomplete="email" />
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" type="password" id="password" required autocomplete="current-password" minlength="6" />
          </div>

          <button class="button button-primary" style="width: 100%; margin-top: 1rem;" type="submit" id="submit-btn">
            Sign In
          </button>
        </form>

        <div class="text-center" style="margin-top: 1.25rem;">
          <a href="#" id="toggle-auth-mode" style="font-size: 0.85rem; font-weight: 700; color: var(--accent);">
            Don't have an account? Sign up
          </a>
        </div>

        <div class="auth-divider">Or continue with</div>

        <button class="google-btn" id="google-btn" type="button">
          <!-- Google G Logo SVG -->
          <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
          </svg>
          Google
        </button>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <span>CSEHub · Computer science, made clearer.</span>
        <a href="articles.html">Browse the library</a>
      </div>
    </footer>

    <!-- Supabase Client Library CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script type="module">
      import { initNavbar } from './js/navbar.js';
      import { loginWithEmail, signupWithEmail, loginWithGoogle } from './js/auth.js';

      let isLoginMode = true;

      document.addEventListener("DOMContentLoaded", () => {
        initNavbar();

        const form = document.querySelector("#auth-form");
        const title = document.querySelector("#auth-title");
        const subtitle = document.querySelector("#auth-subtitle");
        const submitBtn = document.querySelector("#submit-btn");
        const toggleBtn = document.querySelector("#toggle-auth-mode");
        const googleBtn = document.querySelector("#google-btn");
        const alertBox = document.querySelector("#alert-box");

        // Get redirect query param
        const urlParams = new URLSearchParams(window.location.search);
        const redirectUrl = urlParams.get('redirect') || 'index.html';

        toggleBtn.addEventListener("click", (e) => {
          e.preventDefault();
          isLoginMode = !isLoginMode;
          alertBox.innerHTML = ""; // Clear errors

          if (isLoginMode) {
            title.textContent = "Welcome Back";
            subtitle.textContent = "Sign in to your CSEHub account";
            submitBtn.textContent = "Sign In";
            toggleBtn.textContent = "Don't have an account? Sign up";
          } else {
            title.textContent = "Create Account";
            subtitle.textContent = "Sign up to start learning on CSEHub";
            submitBtn.textContent = "Sign Up";
            toggleBtn.textContent = "Already have an account? Sign in";
          }
        });

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          alertBox.innerHTML = "";
          submitBtn.disabled = true;
          const origText = submitBtn.textContent;
          submitBtn.textContent = isLoginMode ? "Signing in..." : "Signing up...";

          const email = document.querySelector("#email").value.trim();
          const password = document.querySelector("#password").value;

          try {
            if (isLoginMode) {
              await loginWithEmail(email, password);
              alertBox.innerHTML = `<div class="alert alert-success">Login successful! Redirecting...</div>`;
              setTimeout(() => {
                window.location.href = redirectUrl;
              }, 1000);
            } else {
              await signupWithEmail(email, password);
              alertBox.innerHTML = `<div class="alert alert-success">Registration successful! Verification email sent if configured, or you can now sign in.</div>`;
              setTimeout(() => {
                isLoginMode = true;
                title.textContent = "Welcome Back";
                subtitle.textContent = "Sign in to your CSEHub account";
                submitBtn.textContent = "Sign In";
                toggleBtn.textContent = "Don't have an account? Sign up";
                submitBtn.disabled = false;
                submitBtn.textContent = "Sign In";
              }, 3000);
            }
          } catch (err) {
            console.error(err);
            alertBox.innerHTML = `<div class="alert alert-error"><strong>Authentication Failed:</strong> ${err.message || 'Unknown error'}</div>`;
            submitBtn.disabled = false;
            submitBtn.textContent = origText;
          }
        });

        googleBtn.addEventListener("click", async () => {
          alertBox.innerHTML = "";
          try {
            await loginWithGoogle();
          } catch (err) {
            console.error(err);
            alertBox.innerHTML = `<div class="alert alert-error"><strong>Google Login Error:</strong> ${err.message}</div>`;
          }
        });
      });
    </script>
  </body>
</html>
