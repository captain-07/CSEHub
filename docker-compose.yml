# Full stack on a single host: PostgreSQL, the Django/Gunicorn API and nginx
# serving the static client.
#
#   docker compose -f docker-compose.yml up --build   # this file alone
#   docker compose up --build                         # + docker-compose.override.yml (dev)
#
# `backend/.env` supplies *secrets* (SECRET_KEY, SUPABASE_URL, Cloudinary,
# Pinecone, Gemini). Everything under `environment:` is *deployment topology*
# and deliberately overrides the same key if `backend/.env` also sets it — see
# the Docker section of README.md.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-csehub}
      POSTGRES_USER: ${POSTGRES_USER:-csehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-csehub}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The backend's `depends_on` waits for this, so migrating at start is safe.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-csehub} -d ${POSTGRES_DB:-csehub}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # Missing on a fresh clone; the topology below still makes the stack usable.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # --- topology (overrides a same-named key in backend/.env) --------------
      DATABASE_URL: postgresql://${POSTGRES_USER:-csehub}:${POSTGRES_PASSWORD:-csehub}@db:5432/${POSTGRES_DB:-csehub}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DEBUG: ${DEBUG:-False}
      # Nothing terminates TLS in front of this stack, so Django must not try to
      # redirect to HTTPS. Set True once a proxy handles the certificates.
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      # Sample content is opt-in; see docker/docker-entrypoint.sh.
      SEED_ON_START: ${SEED_ON_START:-false}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Used only when USE_REMOTE_STORAGE=False (filesystem image storage).
      - media-data:/app/backend/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Plain socket probe: the slim image has no curl, and this must not depend
      # on the database being reachable.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    image: nginx:1.27-alpine
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  media-data:
